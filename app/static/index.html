<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STT Centy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FAFAFA;
            --surface: #FFFFFF;
            --border: #EAEAEA;
            --border-hover: #999999;
            --text-main: #111111;
            --text-muted: #666666;
            --primary: #000000;
            --primary-hover: #333333;
            --radius: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 3rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            margin-bottom: 0.5rem;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .upload-area {
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
            background-color: var(--bg);
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--border-hover);
        }

        .upload-icon {
            margin-bottom: 0.75rem;
            color: var(--text-muted);
        }

        .upload-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .upload-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-main);
        }

        select, input[type="text"] {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background-color: var(--surface);
            color: var(--text-main);
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--border-hover);
        }

        .help-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: var(--radius);
            border: none;
            background-color: var(--primary);
            color: #FFFFFF;
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background-color: var(--bg);
            border-color: var(--border-hover);
        }

        .status-ui, .result-ui {
            display: none;
            flex-direction: column;
            gap: 1rem;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-title {
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .progress-track {
            width: 100%;
            height: 3px;
            background-color: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .progress-fill.pulse {
            width: 20%;
            animation: pulse-move 1.5s infinite linear;
        }

        @keyframes pulse-move {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(500%); }
        }

        .log-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .result-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .result-actions a {
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text-main);
            text-align: center;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .result-actions a:hover {
            border-color: var(--border-hover);
            background: var(--bg);
        }

        .text-output {
            width: 100%;
            min-height: 240px;
            padding: 0.75rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background-color: var(--surface);
            font-size: 0.875rem;
            line-height: 1.5;
            resize: vertical;
            color: var(--text-main);
            outline: none;
        }

        .text-output:focus {
            border-color: var(--border-hover);
        }

        #file-input { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>STT Centy</h1>
            <p>Система транскрибации медиафайлов</p>
        </header>

        <div class="card" id="setup-card">
            <div class="upload-area" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <div class="upload-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </div>
                <div class="upload-title" id="file-name">Выберите файл</div>
                <div class="upload-subtitle">Поддерживаются форматы аудио и видео</div>
                <input type="file" id="file-input" accept="audio/*,video/*" onchange="handleFile(this.files[0])">
            </div>

            <div class="form-group">
                <label for="language">Язык дорожки</label>
                <select id="language">
                    <option value="auto">Автоопределение</option>
                    <option value="ru">Русский</option>
                    <option value="kk">Казахский</option>
                    <option value="en">Английский</option>
                </select>
            </div>

            <div class="form-group">
                <label for="prompt">Контекст словаря</label>
                <input type="text" id="prompt" placeholder="Специфичные имена, аббревиатуры...">
                <div class="help-text">Дополнительные вводные для корректировки орфографии.</div>
            </div>

            <button class="btn" id="start-btn" onclick="startProcess()" disabled>Запустить обработку</button>
        </div>

        <div class="card status-ui" id="status-card">
            <div class="status-header">
                <div class="status-title">Выполнение задачи</div>
                <span class="status-badge" id="status-badge">ПОДГОТОВКА</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill pulse" id="progress-fill"></div>
            </div>
            <div class="log-text" id="log-text">Инициализация сервиса...</div>
        </div>

        <div class="card result-ui" id="result-card">
            <div class="status-header">
                <div class="status-title">Результат</div>
            </div>
            
            <textarea class="text-output" id="text-output" readonly></textarea>
            
            <div class="result-actions">
                <a href="#" id="dl-txt" target="_blank">TXT</a>
                <a href="#" id="dl-srt" target="_blank">SRT</a>
                <a href="#" id="dl-vtt" target="_blank">VTT</a>
                <a href="#" id="dl-json" target="_blank">JSON</a>
            </div>
            
            <button class="btn btn-outline" onclick="location.reload()" style="margin-top: 0.5rem;">Новая задача</button>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let taskId = null;
        let timer = null;

        const dropZone = document.getElementById('drop-zone');
        const fileNameEl = document.getElementById('file-name');
        const startBtn = document.getElementById('start-btn');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, preventDefaults));
        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }
        
        ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.add('dragover')));
        ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.remove('dragover')));
        
        dropZone.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));

        window.handleFile = function(file) {
            if (!file) return;
            selectedFile = file;
            fileNameEl.textContent = file.name;
            startBtn.disabled = false;
        };

        window.startProcess = async function() {
            if (!selectedFile) return;

            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('status-card').style.display = 'flex';

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('language', document.getElementById('language').value);
            formData.append('prompt', document.getElementById('prompt').value);

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                if (!res.ok) throw new Error("Ошибка загрузки файла");
                const data = await res.json();
                taskId = data.task_id;
                
                timer = setInterval(checkStatus, 2000);
            } catch (err) {
                failProcess(err.message);
            }
        }

        async function checkStatus() {
            if (!taskId) return;
            try {
                const res = await fetch(`/status/${taskId}`);
                if (!res.ok) return;
                const data = await res.json();

                document.getElementById('status-badge').textContent = data.status;
                document.getElementById('log-text').textContent = data.message || "Обработка...";

                if (data.status === 'completed') {
                    clearInterval(timer);
                    showResult(data);
                } else if (data.status === 'failed') {
                    clearInterval(timer);
                    failProcess(data.message);
                }
            } catch (e) { console.error(e); }
        }

        function failProcess(msg) {
            document.getElementById('status-badge').textContent = "ОШИБКА";
            document.getElementById('status-badge').style.color = "#dc2626";
            document.getElementById('progress-fill').style.animation = "none";
            document.getElementById('progress-fill').style.width = "100%";
            document.getElementById('progress-fill').style.backgroundColor = "#dc2626";
            document.getElementById('log-text').textContent = msg;
        }

        function showResult(data) {
            document.getElementById('status-card').style.display = 'none';
            document.getElementById('result-card').style.display = 'flex';

            document.getElementById('dl-txt').href = `/download/${taskId}/txt`;
            document.getElementById('dl-srt').href = `/download/${taskId}/srt`;
            document.getElementById('dl-vtt').href = `/download/${taskId}/vtt`;
            document.getElementById('dl-json').href = `/result/${taskId}`;

            if (data.text) {
                document.getElementById('text-output').value = data.text;
            } else {
                fetch(`/result/${taskId}`).then(r => r.json()).then(res => {
                    document.getElementById('text-output').value = res.text || '';
                });
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STT Centy | Speech-to-Text Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: rgba(30, 41, 59, 0.7);
            --surface-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            background-attachment: fixed;
        }

        header {
            width: 100%;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid var(--surface-border);
            backdrop-filter: blur(10px);
            background: rgba(11, 15, 25, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .glass-card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
        }

        .upload-zone {
            border: 2px dashed rgba(99, 102, 241, 0.4);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .upload-text {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .upload-subtext {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        #file-input {
            display: none;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            align-items: center;
        }

        select, button {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--surface-border);
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-container {
            display: none;
            flex-direction: column;
            gap: 1rem;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.5s ease;
        }

        .progress-fill.indeterminate {
            width: 30%;
            animation: moveProgress 1.5s infinite linear;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        @keyframes moveProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }

        .log-box {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--text-muted);
            max-height: 150px;
            overflow-y: auto;
        }

        .result-container {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
        }

        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }

        .btn-download {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--surface-border);
            text-decoration: none;
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-download:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
        }

        .text-preview {
            background: rgba(0,0,0,0.2);
            padding: 1.5rem;
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.6;
            color: #cbd5e1;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">STT Centy</div>
    </header>

    <div class="container">
        
        <!-- Upload Section -->
        <div class="glass-card" id="upload-card">
            <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <div class="upload-icon">🎙️</div>
                <div class="upload-text" id="file-name-display">Нажмите или перетащите аудиофайл</div>
                <div class="upload-subtext">mp3, wav, m4a, mp4, ogg до 500 MB</div>
                <input type="file" id="file-input" accept="audio/*,video/*" onchange="handleFileSelect(event)">
            </div>
            
            <div class="controls">
                <select id="language-select">
                    <option value="auto">Язык: Автоопределение</option>
                    <option value="ru">Русский</option>
                    <option value="kk">Казахский</option>
                </select>
                <button class="btn-primary" id="start-btn" onclick="startTranscription()" disabled>Начать распознавание</button>
            </div>
        </div>

        <!-- Status Section -->
        <div class="glass-card status-container" id="status-card">
            <div class="status-header">
                <h3>Обработка файла</h3>
                <span class="status-badge" id="status-badge">QUEUED</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill indeterminate" id="progress-bar-fill"></div>
            </div>
            <div class="log-box" id="log-box">
                > Инициализация задачи...
            </div>
        </div>

        <!-- Result Section -->
        <div class="glass-card result-container" id="result-card">
            <h3>Результаты готовы</h3>
            <div class="download-grid">
                <a href="#" class="btn-download" id="dl-txt" target="_blank">📄 TXT</a>
                <a href="#" class="btn-download" id="dl-srt" target="_blank">🎬 SRT</a>
                <a href="#" class="btn-download" id="dl-vtt" target="_blank">🌐 VTT</a>
                <a href="#" class="btn-download" id="dl-json" target="_blank">⚙️ JSON</a>
            </div>
            <div class="text-preview" id="text-preview"></div>
        </div>

    </div>

    <script>
        let selectedFile = null;
        let currentTaskId = null;
        let pollInterval = null;

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name-display');
        const startBtn = document.getElementById('start-btn');
        const uploadCard = document.getElementById('upload-card');
        const statusCard = document.getElementById('status-card');
        const resultCard = document.getElementById('result-card');
        const logBox = document.getElementById('log-box');
        const statusBadge = document.getElementById('status-badge');

        // Drag and drop handlers
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });

        function handleFileSelect(e) {
            handleFiles(e.target.files);
        }

        function handleFiles(files) {
            if (files.length > 0) {
                selectedFile = files[0];
                fileNameDisplay.textContent = selectedFile.name;
                startBtn.disabled = false;
            }
        }

        function appendLog(msg) {
            logBox.innerHTML += `\n> ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function startTranscription() {
            if (!selectedFile) return;

            const language = document.getElementById('language-select').value;
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('language', language);

            startBtn.disabled = true;
            appendLog('Загрузка файла на сервер...');
            statusCard.style.display = 'flex';
            resultCard.style.display = 'none';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                const data = await response.json();
                currentTaskId = data.task_id;
                appendLog(`Файл загружен. Task ID: ${currentTaskId}`);
                
                // Start polling
                pollInterval = setInterval(pollStatus, 2000);
            } catch (error) {
                appendLog(`Ошибка загрузки: ${error.message}`);
                startBtn.disabled = false;
                statusBadge.textContent = 'ERROR';
                statusBadge.style.color = 'var(--danger)';
                document.getElementById('progress-bar-fill').style.animation = 'none';
                document.getElementById('progress-bar-fill').style.width = '100%';
                document.getElementById('progress-bar-fill').style.background = 'var(--danger)';
            }
        }

        async function pollStatus() {
            if (!currentTaskId) return;

            try {
                const response = await fetch(`/status/${currentTaskId}`);
                if (!response.ok) throw new Error('Status check failed');

                const data = await response.json();
                statusBadge.textContent = data.status;
                
                if (data.message) {
                    // Only append if it's a new message
                    if (!logBox.innerText.includes(data.message)) {
                        appendLog(data.message);
                    }
                }

                if (data.status === 'completed') {
                    clearInterval(pollInterval);
                    showResults(data);
                } else if (data.status === 'failed') {
                    clearInterval(pollInterval);
                    statusBadge.style.color = 'var(--danger)';
                    document.getElementById('progress-bar-fill').style.animation = 'none';
                    document.getElementById('progress-bar-fill').style.background = 'var(--danger)';
                    startBtn.disabled = false;
                }
            } catch (error) {
                console.error("Polling error:", error);
            }
        }

        function showResults(data) {
            document.getElementById('progress-bar-fill').style.animation = 'none';
            document.getElementById('progress-bar-fill').style.width = '100%';
            document.getElementById('progress-bar-fill').style.background = 'var(--success)';
            statusBadge.style.color = 'var(--success)';

            resultCard.style.display = 'flex';
            
            // Set download links
            document.getElementById('dl-txt').href = `/download/${currentTaskId}/txt`;
            document.getElementById('dl-srt').href = `/download/${currentTaskId}/srt`;
            document.getElementById('dl-vtt').href = `/download/${currentTaskId}/vtt`;
            document.getElementById('dl-json').href = `/result/${currentTaskId}`;

            // Show text preview
            if (data.text) {
                document.getElementById('text-preview').textContent = data.text;
            } else {
                // Fetch result JSON if text not included in status
                fetch(`/result/${currentTaskId}`)
                    .then(r => r.json())
                    .then(res => {
                        document.getElementById('text-preview').textContent = res.text || 'Нет текста';
                    });
            }

            startBtn.disabled = false;
        }
    </script>
</body>
</html>
